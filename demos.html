
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AntiFa – Veranstaltungen</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <header class="site-header">
    <a class="logo" href="index.html">AntiFa</a>
    <nav>
      <a href="index.html">Startseite</a>
      <a href="demos.html">Veranstaltungen</a>
    </nav>
  </header>

  <main class="events-page">
    <h1>Veranstaltungen entdecken</h1>
    <p>Durchsuche öffentliche Veranstaltungen.</p>

    <section class="search-panel">
      <label for="search">Stadt, Titel oder Thema</label>
      <input
        id="search"
        type="search"
        placeholder="Zum Beispiel Berlin oder Kultur"
      >

      <label for="date">Datum</label>
      <input id="date" type="date">
    </section>

    <p class="update-info">
      Zuletzt aktualisiert:
      <span id="last-updated">Wird geladen …</span>
    </p>

    <section id="results" aria-live="polite">
      Veranstaltungen werden geladen …
    </section>
  </main>
</body>
</html>
