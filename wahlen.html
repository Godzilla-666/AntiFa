
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AntiFa – Anstehende Wahlen</title>
  <link rel="stylesheet" href="style.css">
  <script src="wahlen.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">AntiFa</a>
    <nav>
      <a href="index.html">Startseite</a>
      <a href="demos.html">Veranstaltungen</a>
      <a href="wahlen.html">Wahlen</a>
    </nav>
  </header>

  <main class="elections-page">
    <h1>Anstehende Wahlen</h1>
    <p>Eine neutrale Übersicht der veröffentlichten Wahltermine in Deutschland.</p>

        
<input
  id="election-search"
  type="search"
  list="election-suggestions"
  placeholder="Bundesland oder Stadt suchen..."
  aria-label="Wahlen durchsuchen"
>

<datalist id="election-suggestions">
  <option value="Baden-Württemberg">
  <option value="Bayern">
  <option value="Berlin">
  <option value="Brandenburg">
  <option value="Bremen">
  <option value="Hamburg">
  <option value="Hessen">
  <option value="Mecklenburg-Vorpommern">
  <option value="Niedersachsen">
  <option value="Nordrhein-Westfalen">
  <option value="Rheinland-Pfalz">
  <option value="Saarland">
  <option value="Sachsen">
  <option value="Sachsen-Anhalt">
  <option value="Schleswig-Holstein">
  <option value="Thüringen">
  <option value="Flensburg">
  <option value="Kiel">
  <option value="Lübeck">
  <option value="Hamburg">
  <option value="München">
  <option value="Berlin">
  <option value="Dresden">
  <option value="Potsdam">
  <option value="Hannover">
  <option value="Bremen">
  <option value="Stuttgart">
  <option value="Mainz">
  <option value="Düsseldorf">
  <option value="Magdeburg">
  <option value="Erfurt">
  <option value="Schwerin">
</datalist>


    <p class="update-info">
      Datenstand: <span id="election-updated">Wird geladen ...</span>
    </p>

    <p id="election-status" aria-live="polite">
      Wahltermine werden geladen ...
    </p>

    <section id="election-results"></section>

    <p class="source-note">
      Quelle:
      <a
        href="https://www.bundeswahlleiterin.de/service/wahltermine.html"
        target="_blank"
        rel="noopener noreferrer"
      >Die Bundeswahlleiterin – künftige Wahltermine</a>
    </p>
  </main>
</body>
</html>
